services:
  # Zookeeper (Private Service for distributed locks/coordination)
  - type: pserv
    name: zookeeper
    env: docker
    repo: https://github.com/HappyNoob0/URL-shortener
    branch: main
    dockerfilePath: ./render-zookeeper.Dockerfile

  # Redis (Render Managed Redis)
  - type: redis
    name: url-shortener-redis
    ipAllowList: [] # only allow internal connections
    plan: free

  # Node.js API Server
  - type: web
    name: url-shortener-api
    env: node
    region: oregon
    repo: https://github.com/HappyNoob0/URL-shortener
    branch: main
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: ZOOKEEPER_HOST
        value: zookeeper
      - key: ZOOKEEPER_DOCKER_PORT
        value: 2181
      - key: REDIS_HOST
        fromService:
          type: redis
          name: url-shortener-redis
          property: host
      - key: REDIS_DOCKER_PORT
        fromService:
          type: redis
          name: url-shortener-redis
          property: port
      - key: NODE_SERVER_LOCAL_PORT
        value: 10000
      - key: PORT
        value: 10000
      # IMPORTANT: User must set these in Render Dashboard (using MongoDB Atlas)
      - key: MONGODB_HOST
        sync: false
      - key: MONGODB_USER
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_DATABASE
        sync: false
